<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoodini-Viz Local Test</title>
  
  <!-- Google Fonts (required for proper styling) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Load CSS from unpkg CDN -->
  <link rel="stylesheet" href="https://unpkg.com/hoodini-viz/dist/hoodini-viz.css">
  <style>
    /* Don't add unlayered reset styles - they override Tailwind's @layer utilities */
    /* Tailwind Preflight already handles resets in @layer base */
    html, body, #root { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- Load JS from unpkg CDN -->
  <script src="https://unpkg.com/hoodini-viz/dist/hoodini-viz.umd.js"></script>
  <script>
    console.log('HoodiniViz:', HoodiniViz);
    console.log('Keys:', Object.keys(HoodiniViz));
    
    const { HoodiniDashboard, React, ReactDOM } = HoodiniViz;
    console.log('React:', React);
    console.log('ReactDOM:', ReactDOM);
    
    // Base URL for raw GitHub content
    const GITHUB_RAW = 'https://raw.githubusercontent.com/pentamorfico/hoodini-viz/main/src/data';
    
    const dataPaths = {
      // Newick tree
      newick: `${GITHUB_RAW}/small/tree.nwk`,
      
      // Parquet files (from small dataset)
      gffParquet: `${GITHUB_RAW}/small/parquet/gff.parquet`,
      hoodsParquet: `${GITHUB_RAW}/small/parquet/hoods.parquet`,
      proteinLinksParquet: `${GITHUB_RAW}/small/parquet/protein_links.parquet`,
      nucleotideLinksParquet: `${GITHUB_RAW}/small/parquet/nucleotide_links.parquet`,
      domainsParquet: `${GITHUB_RAW}/small/parquet/domains.parquet`,
      proteinMetadataParquet: `${GITHUB_RAW}/small/parquet/protein_metadata.parquet`,
      domainsMetadataParquet: `${GITHUB_RAW}/small/parquet/domains_metadata.parquet`,
      treeMetadataParquet: `${GITHUB_RAW}/small/parquet/tree_metadata.parquet`,
      ncRNAMetadataParquet: `${GITHUB_RAW}/small/parquet/ncrna_metadata.parquet`,
    };
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(HoodiniDashboard, { dataPaths }));
  </script>
</body>
</html>
