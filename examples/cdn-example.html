<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoodini-Viz CDN Example</title>
  
  <!-- Google Fonts (required for proper styling) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Hoodini styles -->
  <link rel="stylesheet" href="https://unpkg.com/hoodini-viz/dist/hoodini-viz.css">
  
  <!-- Google Fonts (optional) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      height: 100%;
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Hoodini-Viz UMD (includes React) -->
  <script src="https://unpkg.com/hoodini-viz/dist/hoodini-viz.umd.js"></script>

  <script>
    // HoodiniViz includes React and ReactDOM
    const { HoodiniDashboard, React, ReactDOM } = HoodiniViz;

    const dataPaths = {
      tree: 'https://raw.githubusercontent.com/pentamorfico/hoodini-viz/main/src/data/tree.nwk',
      // Add your data paths:
      // hoods: 'path/to/hoods.parquet',
      // domains: 'path/to/domains.parquet',
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(HoodiniDashboard, { dataPaths }));
  </script>
</body>
</html>
