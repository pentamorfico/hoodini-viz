<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoodini-Viz CDN Example</title>
  
  <!-- Load CSS from unpkg CDN -->
  <link rel="stylesheet" href="https://unpkg.com/hoodini-viz/dist/hoodini-viz.css">
</head>
<body>
  <div id="root"></div>
  <!-- Load JS from unpkg CDN -->
  <script src="https://unpkg.com/hoodini-viz/dist/hoodini-viz.umd.js"></script>
  <script>
    const GITHUB_RAW = 'https://raw.githubusercontent.com/pentamorfico/hoodini-viz/main/src/data';
    
    // Full dashboard with data loading, sidebar, and all controls
    HoodiniViz.createDashboard({
      container: 'root',
      dataPaths: {
        newick: `${GITHUB_RAW}/small/tree.nwk`,
        gffParquet: `${GITHUB_RAW}/small/parquet/gff.parquet`,
        hoodsParquet: `${GITHUB_RAW}/small/parquet/hoods.parquet`,
        proteinLinksParquet: `${GITHUB_RAW}/small/parquet/protein_links.parquet`,
        nucleotideLinksParquet: `${GITHUB_RAW}/small/parquet/nucleotide_links.parquet`,
        domainsParquet: `${GITHUB_RAW}/small/parquet/domains.parquet`,
        proteinMetadataParquet: `${GITHUB_RAW}/small/parquet/protein_metadata.parquet`,
        domainsMetadataParquet: `${GITHUB_RAW}/small/parquet/domains_metadata.parquet`,
        treeMetadataParquet: `${GITHUB_RAW}/small/parquet/tree_metadata.parquet`,
        ncRNAMetadataParquet: `${GITHUB_RAW}/small/parquet/ncrna_metadata.parquet`,
      }
    });

    // Alternative: For advanced users who want just the visualization
    // HoodiniViz.createViz({
    //   container: 'root',
    //   newickStr: '((A:0.1,B:0.2):0.3,C:0.4);',
    //   gffFeatures: [...],
    //   hoods: [...],
    // });
  </script>
</body>
</html>
